<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Outshark — New Website</title>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0e1525;color:#fff;padding:24px}
    main{text-align:center;max-width:520px}
    h1{font-size:clamp(2.1rem,8vw,4rem);margin:0 0 14px;letter-spacing:-.05em}
    p{color:#b5bed0;line-height:1.6;font-size:1.05rem}
    .dot{height:12px;width:12px;border-radius:50%;background:#67e8a5;margin:0 auto 24px}
  </style>
</head>
<body>
<main><div class="dot" aria-hidden="true"></div><h1>Outshark</h1><p>A new website is being created.</p></main>
</body>
</html>
