name: Outshark static website checks
on:
  push:
    branches: [main, outshark-v2-development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
      - name: Check Oracle maintenance script syntax
        run: bash -n integrations/oracle-safe-clean.sh integrations/server-recovery.sh integrations/oracle-security-audit.sh
