<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Count words, characters and estimated reading time."><title>Word Counter — Outshark</title><link rel="stylesheet" href="../assets/styles.css"></head>
<body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">O</span><span>OUTSHARK</span></a><nav><a href="../index.html#tools">All tools</a><a href="../request-tool.html">Request a tool</a></nav></header>
<main class="content-page"><div class="eyebrow dark">DOCUMENT TOOL</div><h1>Word Counter</h1><p>Paste or type text to count words, characters, sentences and estimated reading time. Text is processed in your browser.</p>
<div class="tool-panel"><label for="text-input"><strong>Your text</strong></label><textarea id="text-input" placeholder="Start typing or paste your text here..."></textarea><div class="category-grid" style="margin-top:15px"><div class="category-card"><strong id="words">0</strong><small>Words</small></div><div class="category-card"><strong id="chars">0</strong><small>Characters</small></div><div class="category-card"><strong id="sentences">0</strong><small>Sentences</small></div><div class="category-card"><strong id="reading">0 min</strong><small>Reading time</small></div></div><button class="primary-button" id="clear" style="margin-top:15px">Clear text</button></div><p><a href="../index.html">← Back to all tools</a></p></main>
<footer class="site-footer"><a class="brand footer-brand" href="../index.html"><span class="brand-mark">O</span><span>OUTSHARK</span></a><small>© <span class="year"></span> Outshark</small></footer>
<script>
const input=document.getElementById('text-input');
function update(){const t=input.value.trim(), words=t?t.split(/\s+/u).length:0, sentences=t?(t.match(/[.!?]+(?=\s|$)/g)||[]).length:0;document.getElementById('words').textContent=words;document.getElementById('chars').textContent=input.value.length;document.getElementById('sentences').textContent=sentences;document.getElementById('reading').textContent=Math.max(1,Math.ceil(words/200))+' min';if(!words)document.getElementById('reading').textContent='0 min';}
input.addEventListener('input',update);document.getElementById('clear').addEventListener('click',()=>{input.value='';update();});document.querySelector('.year').textContent=new Date().getFullYear();
</script></body></html>
